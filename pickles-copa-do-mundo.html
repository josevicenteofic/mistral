/* ================= UTILITÁRIOS ================= */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeIn=t=>Math.pow(clamp(t,0,1),2.2);
const frac=x=>x-Math.floor(x);
const hash=i=>frac(Math.sin(i*127.1+311.7)*43758.5453);
const TAU=Math.PI*2;
const OUT='#141414', FACE='#FFFDF9';

function rr(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function circle(g,x,y,r){ g.beginPath(); g.arc(x,y,r,0,TAU); }
function ell(g,x,y,rx,ry,rot){ g.beginPath(); g.ellipse(x,y,rx,ry,rot||0,0,TAU); }
function outline(g,w){ g.strokeStyle=OUT; g.lineWidth=w; g.lineJoin='round'; g.lineCap='round'; }
function capsule(g,x1,y1,x2,y2,w,col){
  g.lineCap='round'; g.strokeStyle=OUT; g.lineWidth=w+11;
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  g.strokeStyle=col; g.lineWidth=w;
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
}
function withCam(g,cam,fn){
  g.save();
  g.translate(W/2,H/2); g.scale(cam.z,cam.z); if(cam.r) g.rotate(cam.r);
  g.translate(-cam.x,-cam.y);
  fn(); g.restore();
}
function camAt(keys,lt){
  let a=keys[0], b=null;
  for(let i=0;i<keys.length;i++){
    if(keys[i].t<=lt) a=keys[i]; else { b=keys[i]; break; }
  }
  if(!b) return {x:a.x,y:a.y,z:a.z};
  if(b.snap) return lt<b.t ? {x:a.x,y:a.y,z:a.z} : {x:b.x,y:b.y,z:b.z};
  const k=sstep((lt-a.t)/Math.max(0.0001,b.t-a.t));
  return {x:lerp(a.x,b.x,k), y:lerp(a.y,b.y,k), z:lerp(a.z,b.z,k)};
}
function drift(cam,lt,seed){
  cam.x+=Math.sin(lt*0.55+seed)*6; cam.y+=Math.cos(lt*0.4+seed*2)*5;
  cam.z*=1+Math.sin(lt*0.3+seed)*0.004;
  return cam;
}
function shakeAt(lt,cut){
  if(lt<cut) return 0;
  const d=lt-cut; return d<0.7 ? Math.exp(-d*5)*10*Math.sin(d*55) : 0;
}
/* partículas determinísticas */
function dust(g,t,n,seed,x0,x1,y0,y1,size,alpha){
  g.save(); g.globalCompositeOperation='screen';
  for(let i=0;i<n;i++){
    const sp=8+hash(i+seed)*26;
    const x=x0+frac(hash(i+seed*3)+t*0.013*(0.4+hash(i)*0.8))*(x1-x0);
    const y=y0+frac(hash(i*2+seed)+t*0.01*(0.3+hash(i+5)*0.7))*(y1-y0);
    const tw=0.5+0.5*Math.sin(t*(1+hash(i+9)*2)+i);
    g.fillStyle='rgba(255,238,200,'+(alpha*tw).toFixed(3)+')';
    circle(g,x, y, size*(0.5+hash(i+2))); g.fill();
  }
  g.restore();
}
function sparkles(g,t,n,seed,cx,cy,rad,col){
  g.save(); g.globalCompositeOperation='screen';
  for(let i=0;i<n;i++){
    const a=hash(i+seed)*TAU+t*(0.2+hash(i)*0.5);
    const rr2=rad*(0.25+0.75*frac(hash(i*3+seed)+t*0.05*(0.3+hash(i+4))));
    const x=cx+Math.cos(a)*rr2, y=cy+Math.sin(a)*rr2*0.8;
    const tw=Math.max(0,Math.sin(t*(2+hash(i+7)*3)+i*2));
    if(tw<=0.02) continue;
    g.fillStyle=col||('rgba(255,224,130,'+(0.75*tw).toFixed(3)+')');
    const s=3+9*tw;
    g.beginPath();
    g.moveTo(x,y-s); g.quadraticCurveTo(x,y,x+s,y); g.quadraticCurveTo(x,y,x,y+s);
    g.quadraticCurveTo(x,y,x-s,y); g.quadraticCurveTo(x,y,x,y-s); g.fill();
  }
  g.restore();
}
function rays(g,x,y,n,len,alpha,col,t){
  g.save(); g.globalCompositeOperation='screen'; g.translate(x,y); g.rotate(t*0.15);
  for(let i=0;i<n;i++){
    const a=i/n*TAU;
    const w=0.05+0.05*Math.sin(t*1.3+i*2.1);
    g.fillStyle=col||('rgba(255,222,140,'+alpha.toFixed(3)+')');
    g.beginPath(); g.moveTo(0,0);
    g.lineTo(Math.cos(a-w)*len,Math.sin(a-w)*len);
    g.lineTo(Math.cos(a+w)*len,Math.sin(a+w)*len);
    g.closePath(); g.fill();
  }
  g.restore();
}
function glow(g,x,y,r,col){
  g.save(); g.globalCompositeOperation='screen';
  const gr=g.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; circle(g,x,y,r); g.fill(); g.restore();
}

/* ================= PERSONAGENS — estilo consistente ================= */
const EXPR={
  neutral:  {brow:0,  browY:0,  mouth:'flat',  eyes:'dot'},
  happy:    {brow:-3, browY:-2, mouth:'smile', eyes:'dot'},
  proud:    {brow:-3, browY:-2, mouth:'smile', eyes:'dot'},
  surprised:{brow:5,  browY:-7, mouth:'o',     eyes:'wide'},
  worried:  {brow:0,  browY:-3, mouth:'worry', eyes:'dot', tilt:1},
  amazed:   {brow:8,  browY:-10,mouth:'O',     eyes:'wide'},
  sad:      {brow:0,  browY:-3, mouth:'worry', eyes:'dot', tilt:-1}
};
function blinkAmt(t){ const b=frac(t/3.7); return b<0.09 ? Math.sin(b/0.09*Math.PI) : 0; }

function drawHumanHead(g,hy,o){
  const ft=(o.faceTurn||0)*20, ex=EXPR[o.expr||'neutral'], bl=blinkAmt(o.blinkT||0);
  g.fillStyle=o.hair||'#4a3120'; outline(g,6);
  circle(g,0,hy-8,57); g.fill(); g.stroke();
  g.fillStyle=FACE; outline(g,6);
  circle(g,0,hy+10,50); g.fill(); g.stroke();
  if(o.cap){
    g.fillStyle=o.cap; outline(g,5);
    g.beginPath(); g.ellipse(0,hy-26,55,26,0,Math.PI,0); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(6,hy-24,58,13,0,0,TAU); g.fill(); g.stroke();
  }
  const ey=hy+2;
  for(const s of [-1,1]){
    const exx=s*18+ft;
    if(ex.eyes==='wide'){
      g.fillStyle='#ffffff'; outline(g,3.5);
      circle(g,exx,ey,10.5); g.fill(); g.stroke();
      g.fillStyle=OUT; circle(g,exx,ey+1,4.6); g.fill();
    }else{
      g.save(); g.translate(exx,ey); g.scale(1,1-bl*0.92);
      g.fillStyle=OUT; circle(g,0,0,5.6); g.fill(); g.restore();
    }
    const bx=exx, by=ey-17+(ex.browY||0);
    g.strokeStyle=OUT; g.lineWidth=5; g.lineCap='round';
    g.beginPath();
    g.moveTo(bx-9,by+(ex.tilt?s*4:0)+(ex.brow||0)*0.4);
    g.quadraticCurveTo(bx,by-(ex.brow||0)*0.6,bx+9,by+(ex.tilt?-s*4:0));
    g.stroke();
  }
  g.fillStyle='rgba(238,130,118,0.42)';
  for(const s of [-1,1]){ circle(g,s*33+ft,hy+24,8); g.fill(); }
  g.strokeStyle=OUT; g.lineWidth=4; g.lineCap='round';
  g.beginPath(); g.moveTo(ft-3,hy+16); g.quadraticCurveTo(ft+2,hy+19,ft+6,hy+15); g.stroke();
  const my=hy+34;
  g.strokeStyle=OUT; g.lineWidth=5; g.lineCap='round';
  if(ex.mouth==='smile'){
    g.beginPath(); g.moveTo(ft-14,my-4); g.quadraticCurveTo(ft,my+9,ft+14,my-4); g.stroke();
  }else if(ex.mouth==='o'||ex.mouth==='O'){
    const R=ex.mouth==='O'?11:7;
    g.fillStyle='#5b2c26'; outline(g,4);
    ell(g,ft,my,R*0.82,R); g.fill(); g.stroke();
  }else if(ex.mouth==='worry'){
    g.beginPath(); g.moveTo(ft-11,my+3); g.quadraticCurveTo(ft,my-4,ft+11,my+3); g.stroke();
  }else{
    g.beginPath(); g.moveTo(ft-9,my); g.lineTo(ft+9,my); g.stroke();
  }
}
function drawHuman(g,o){
  const s=o.s||1, dir=o.dir||1, ph=o.phase||0, walk=o.walk||0, cr=o.crouch||0;
  g.save(); g.translate(o.x,o.y); g.scale(s*dir,s);
  const bob=walk>0?Math.abs(Math.sin(ph))*4:Math.sin((o.idleT||0)*1.7)*2;
  const hipY=-100+cr*62+bob*0.5, shY=-176+cr*80+bob, headY=-240+cr*86+bob;
  const lean=cr*16;
  g.save(); g.translate(lean,0);
  for(const sd of [-1,1]){
    g.fillStyle='rgba(0,0,0,0.22)'; ell(g,sd*16+6,2,20,6); g.fill();
  }
  const top=o.top||'#7a5c3e', bot=o.bottom||'#8b8f96', shoe=o.shoes||'#2b2622';
  if(cr>0.05){
    capsule(g,-14,hipY,-50,-34,15,bot); capsule(g,-50,-34,-56,-4,14,bot);
    capsule(g,14,hipY,42,-44,15,bot);  capsule(g,42,-44,52,-4,14,bot);
    ell(g,-56,-3,15,8,0); g.fillStyle=shoe; outline(g,4); g.fill(); g.stroke();
    ell(g,52,-3,16,8,0); g.fill(); g.stroke();
  }else{
    for(const [sd,p] of [[-1,ph],[1,ph+Math.PI]]){
      const fx=sd*14+Math.sin(p)*24*walk, fy=-Math.max(0,Math.sin(p))*14*walk;
      capsule(g,sd*12,hipY,fx,fy-6,15,bot);
      g.fillStyle='rgba(0,0,0,0.22)'; ell(g,fx+4,1,19,6); g.fill();
      g.fillStyle=shoe; outline(g,4.5);
      ell(g,fx+6,fy-6,17,9); g.fill(); g.stroke();
    }
  }
  if(o.dress){
    g.fillStyle=o.dress; outline(g,6);
    g.beginPath(); g.moveTo(-30,hipY-8); g.lineTo(30,hipY-8);
    g.quadraticCurveTo(58,hipY+40,52,-8); g.lineTo(-52,-8);
    g.quadraticCurveTo(-58,hipY+40,-30,hipY-8); g.closePath(); g.fill(); g.stroke();
  }
  capsule(g,0,hipY+6,lean*0.4,shY,80,o.dress||top);
  if(!o.dress){
    g.strokeStyle='rgba(0,0,0,0.28)'; g.lineWidth=3;
    g.beginPath(); g.moveTo(0,hipY+8); g.lineTo(0,hipY+26); g.stroke();
  }
  g.fillStyle='#f6f2e8';
  g.beginPath(); g.moveTo(-9,shY+2); g.lineTo(9,shY+2); g.lineTo(0,shY+22); g.closePath();
  outline(g,4); g.fill(); g.stroke();
  const armL=o.armL||'down', armR=o.armR||'down';
  function arm(sd,kind,p){
    const sx=sd*36+lean*0.4, sy=shY+12;
    let hx,hy2;
    if(kind==='up'){ hx=sd*54; hy2=sy-74; }
    else if(kind==='hold'){ hx=sd*13+lean*0.5; hy2=-118+cr*80; }

/* ================= LEGENDAS ================= */
function normTxt(s){ return s.toLowerCase().replace(/[.,!?…:;]+$/,''); }
const HILITE=new Set(['1966','copa','mundo','roubada','londres','pickles','david','corbett',
  'pacote','arbusto','taça','própria','desaparecida','celebridade','homenagens','história','recuperar']);
let GROUPS=[];
(function buildGroups(){
  const ws=WORDS.map(w=>({t:w.t,s:w.s,e:Math.max(w.e,w.s+0.12)}));
  let cur=[];
  const flush=()=>{ if(cur.length){ GROUPS.push({ws:cur,s:cur[0].s,e:cur[cur.length-1].e}); cur=[]; } };
  for(const w of ws){
    const prev=cur[cur.length-1];
    const newLen=cur.reduce((a,x)=>a+x.t.length+1,0)+w.t.length;
    if(cur.length&&(cur.length>=3||newLen>18||w.s-prev.e>0.55||/[.!?…]$/.test(prev.t))) flush();
    cur.push(w);
  }
  flush();
  for(let i=0;i<GROUPS.length;i++){
    GROUPS[i].showS=GROUPS[i].s-0.06;
    GROUPS[i].showE=GROUPS[i].e+0.3;
    if(i<GROUPS.length-1) GROUPS[i].showE=Math.min(GROUPS[i].showE,GROUPS[i+1].showS-0.02);
  }
})();
function drawCaptions(g,t){
  const grp=GROUPS.find(G=>t>=G.showS&&t<=G.showE);
  if(!grp) return;
  const vis=grp.ws.filter(w=>t>=w.s-0.03);
  if(!vis.length) return;
  const baseY=Math.round(H*0.68);
  let fs=92;
  const wordW=(f)=>{ g.font='900 '+f+"px 'Arial Black','Arial Bold',Impact,'Segoe UI',sans-serif";
    return vis.map(w=>g.measureText(w.t).width); };
  let ws=wordW(fs);
  const gap=fs*0.3;
  let total=ws.reduce((a,b)=>a+b,0)+gap*(vis.length-1);
  if(total>960){ fs=Math.max(52,fs*960/total); ws=wordW(fs); total=ws.reduce((a,b)=>a+b,0)+fs*0.3*(vis.length-1); }
  g.textBaseline='alphabetic'; g.textAlign='left';
  let x=W/2-total/2;
  vis.forEach((w,i)=>{
    const isNew=t-w.s<0.14;
    const pop=isNew?1+0.26*(1-(t-w.s)/0.14):1;
    const col=HILITE.has(normTxt(w.t))?'#FFC933':'#FFFFFF';
    g.save();
    g.translate(x+ws[i]/2,baseY); g.scale(pop,pop);
    g.font='900 '+fs+"px 'Arial Black','Arial Bold',Impact,'Segoe UI',sans-serif";
    g.textAlign='center';
    g.lineJoin='round'; g.strokeStyle='#000000'; g.lineWidth=10;
    g.strokeText(w.t,0,0);
    g.shadowColor='rgba(0,0,0,0.85)'; g.shadowBlur=16; g.shadowOffsetY=9;
    g.fillStyle=col; g.fillText(w.t,0,0);
    g.restore();
    x+=ws[i]+fs*0.3;
  });
}
/* ================= PÓS-PROCESSAMENTO ================= */
const grainC=[];
(function makeGrain(){
  for(let k=0;k<3;k++){
    const c=document.createElement('canvas'); c.width=270; c.height=480;
    const g=c.getContext('2d'); const im=g.createImageData(270,480);
    for(let i=0;i<im.data.length;i+=4){
      const v=110+Math.random()*90;
      im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255;
    }
    g.putImageData(im,0,0); grainC.push(c);
  }
})();
let vigC=null;
function makeVig(){
  vigC=document.createElement('canvas'); vigC.width=W; vigC.height=H;
  const g=vigC.getContext('2d');
  const gr=g.createRadialGradient(W/2,H*0.46,H*0.28,W/2,H*0.52,H*0.78);
  gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,0.42)');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
}
makeVig();
function postFX(g,t){
  g.save(); g.globalAlpha=0.07; g.globalCompositeOperation='overlay';
  const gc=grainC[Math.floor(t*FPS)%3];
  g.drawImage(gc,0,0,W,H);
  g.restore();
  g.drawImage(vigC,0,0);
}
/* ================= RENDER PRINCIPAL ================= */
const SCENES=[scene1,scene2,scene3,scene4,scene5];
function sceneIndex(t){
  for(let i=BOUNDS.length-1;i>=0;i--) if(t>=BOUNDS[i]) return i;
  return 0;
}
const SCENE_NAMES=['Cena 1 — O Roubo','Cena 2 — O Passeio','Cena 3 — O Pacote','Cena 4 — A Descoberta','Cena 5 — Celebridade'];
function render(t){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const si=sceneIndex(t);
  const lt=t-BOUNDS[si];
  ctx.save();
  SCENES[si](ctx,lt,t);
  ctx.restore();
  const dIn=lt<0.35?0.6*(1-lt/0.35):0;
  if(dIn>0){ ctx.fillStyle='rgba(0,0,0,'+dIn.toFixed(3)+')'; ctx.fillRect(0,0,W,H); }
  drawCaptions(ctx,t);
  postFX(ctx,t);
}
/* ================= ESTADO / LOOP ================= */
const state={t:0,playing:false,duration:39.6,audioReady:false,recording:false};
let virtualT=0;
function updateHUD(){
  document.getElementById('timeLbl').textContent=state.t.toFixed(2)+' s / '+state.duration.toFixed(2)+' s';
  const si=sceneIndex(state.t);
  document.getElementById('sceneLbl').textContent=SCENE_NAMES[si];
  if(!seeking) seekBar.value=Math.round(state.t/state.duration*1000);
  if(state.recording) recLbl.textContent='GRAVANDO… '+state.t.toFixed(1)+'s / '+state.duration.toFixed(1)+'s';
}
let seeking=false;
const seekBar=document.getElementById('seek');
seekBar.addEventListener('input',()=>{
  seeking=true;
  const tt=seekBar.value/1000*state.duration;
  state.t=tt; if(state.audioReady){ try{audio.currentTime=tt;}catch(e){} } else virtualT=tt;
});
seekBar.addEventListener('change',()=>{ seeking=false; });
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state.playing){
    if(state.audioReady){
      state.t=audio.currentTime;
      if(audio.ended||state.t>=state.duration-0.02){
        state.t=state.duration;
        if(state.recording) finishRecording();
        else stopPlayback();
      }
    }else{
      virtualT+=dt; state.t=virtualT;
      if(state.t>=state.duration){
        state.t=state.duration;
        if(state.recording) finishRecording(); else stopPlayback();
      }
    }
  }
  render(state.t);
  updateHUD();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
/* ================= CONTROLES ================= */
const playBtn=document.getElementById('playBtn');
const restartBtn=document.getElementById('restartBtn');
const recBtn=document.getElementById('recBtn');
const loadBtn=document.getElementById('loadBtn');
const fileInput=document.getElementById('fileInput');
const statusEl=document.getElementById('status');
const recBadge=document.getElementById('recBadge');
const recLbl=document.getElementById('recLbl');
function stopPlayback(){
  state.playing=false; try{audio.pause();}catch(e){}
  playBtn.textContent='▶ Play / Pause';
}
function startPlayback(){
  state.playing=true; playBtn.textContent='⏸ Pause';
  if(state.audioReady){ audio.play().catch(()=>{}); }
}
function restart(){
  state.t=0; virtualT=0;
  if(state.audioReady){ try{audio.currentTime=0;}catch(e){} }
}
playBtn.addEventListener('click',()=>{
  if(state.playing) stopPlayback(); else startPlayback();
});
restartBtn.addEventListener('click',()=>{ stopPlayback(); restart(); });
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON'){
    e.preventDefault();
    if(state.playing) stopPlayback(); else startPlayback();
  }
});
loadBtn.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',()=>{
  const f=fileInput.files&&fileInput.files[0];
  if(!f) return;
  const url=URL.createObjectURL(f);
  audio.src=url;
  statusEl.innerHTML='Carregando áudio…';
  audio.onloadedmetadata=()=>{
    const dur=audio.duration||39.6;
    state.duration=Math.max(dur,WORDS.length?WORDS[WORDS.length-1].e+0.05:39.6);
    state.audioReady=true;
    restart(); stopPlayback();
    statusEl.innerHTML='✅ Áudio carregado: <b>'+f.name+'</b> — duração <b>'+dur.toFixed(3)+
      ' s</b>. Animação e legendas sincronizadas ('+WORDS.length+' palavras cronometradas). Clique em ▶ Play.';
  };
  audio.onerror=()=>{ statusEl.innerHTML='⚠️ Não foi possível ler este arquivo de áudio.'; };
});
/* ================= GRAVAÇÃO / EXPORTAÇÃO ================= */
let rec=null, chunks=[], audioGraph=null;
function ensureAudioGraph(){
  if(audioGraph) return audioGraph;
  const AC=window.AudioContext||window.webkitAudioContext;
  const ac=new AC();
  const src=ac.createMediaElementSource(audio);
  const dest=ac.createMediaStreamDestination();
  src.connect(ac.destination);
  src.connect(dest);
  audioGraph={ac,dest};
  return audioGraph;
}
function pickMime(){
  const cands=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
  for(const c of cands){
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}
function finishRecording(){
  stopPlayback();
  if(rec&&rec.state!=='inactive'){
    recLbl.textContent='FINALIZANDO…';
    setTimeout(()=>{ try{rec.stop();}catch(e){} },350);
  }
  state.recording=false;
  recBtn.classList.remove('recording');
  recBadge.classList.remove('on');
  recBtn.disabled=false; playBtn.disabled=false; loadBtn.disabled=false;
}
recBtn.addEventListener('click',async ()=>{
  if(state.recording) return;
  if(!cvs.captureStream||!window.MediaRecorder){
    statusEl.innerHTML='⚠️ Este navegador não suporta gravação (MediaRecorder/captureStream). Use Chrome ou Edge.';
    return;
  }
  const mime=pickMime();
  if(!mime){ statusEl.innerHTML='⚠️ Nenhum formato de vídeo suportado pelo navegador.'; return; }
  try{
    recBtn.disabled=true; playBtn.disabled=true; loadBtn.disabled=true;
    const ag=ensureAudioGraph();
    await ag.ac.resume();
    const stream=cvs.captureStream(FPS);
    if(audioGraph){
      audioGraph.dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
    }
    chunks=[];
    rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000});
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{
      const blob=new Blob(chunks,{type:mime});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='pickles-e-a-taca-da-copa-do-mundo.webm';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),8000);
      statusEl.innerHTML='🎬 Vídeo exportado com áudio ('+(blob.size/1048576).toFixed(1)+' MB, '+mime+').';
    };
    restart();
    rec.start(400);
    state.recording=true;
    recBtn.classList.add('recording');
    recBadge.classList.add('on');
    recLbl.textContent='GRAVANDO… '+state.duration.toFixed(1)+'s';
    statusEl.innerHTML='🔴 Gravando em <b>'+mime+'</b> — não feche a aba até o download iniciar.';
    startPlayback();
  }catch(err){
    statusEl.innerHTML='⚠️ Erro ao iniciar gravação: '+err.message;
    recBtn.disabled=false; playBtn.disabled=false; loadBtn.disabled=false;
    state.recording=false;
  }
});
statusEl.innerHTML='Pronto. Carregue o MP3 da narração e clique em ▶ Play. '+GROUPS.length+' blocos de legenda sincronizados.';
</script>
